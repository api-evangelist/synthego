name: Synthego
description: >-
  Synthego is a genome-engineering company that manufactures synthetic guide RNA (sgRNA, crRNA,
  trRNA), CRISPR kits, and engineered cells for research and cell/gene-therapy development. Its
  public Synthego Order API is a third-party integration API that lets partners retrieve current
  product pricing, generate a priced order preview from a list of guide-RNA sequences, and track an
  order through to checkout on Synthego's eCommerce site. Authentication is by an API key passed in
  the SYNTHEGOAPIKEY header. Synthego was surfaced as a portfolio company of SoftBank Vision Fund.
